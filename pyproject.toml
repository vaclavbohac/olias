[project]
name = "olias"
version = "0.1.0"
description = "Simulates the real ride from Malaga to Olias on a Wahoo Kickr"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "bleak>=3.0.2",
    "fit-tool>=0.9.15",
    "fitdecode>=0.11.0",
    "textual>=8.2.8",
]

[project.scripts]
olias = "olias.cli:main"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "F",  # pyflakes
    "W",  # pycodestyle warnings
    "I",  # isort
    "UP", # pyupgrade
    "B",  # bugbear
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["olias"]
